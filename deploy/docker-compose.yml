name: mini-ticket

services:
  api-gateway:
    build:
      context: ..
      dockerfile: deploy/docker/api-gateway.Dockerfile
    container_name: miniticket-api-gateway
    environment:
      APP_ENV: local
      HTTP_ADDR: ":8080"

      AUTH_SERVICE_ADDR: auth-service:50051
      CONCERT_SERVICE_ADDR: concert-service:50051
      SAGA_SERVICE_ADDR: saga-orchestrator:50051
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started
      concert-service:
        condition: service_started
      saga-orchestrator:
        condition: service_started
    networks:
      - miniticket

  auth-service:
    build:
      context: ..
      dockerfile: deploy/docker/auth.Dockerfile
    container_name: miniticket-auth-service
    environment:
      APP_ENV: local
      GRPC_ADDR: ":50051"
      DATABASE_URL: postgres://auth:auth@auth-db:5432/auth?sslmode=disable
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - miniticket

  auth-db:
    image: postgres:17-alpine
    container_name: miniticket-auth-db
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - miniticket

  concert-service:
    build:
      context: ..
      dockerfile: deploy/docker/concert.Dockerfile
    container_name: miniticket-concert-service
    environment:
      APP_ENV: local
      GRPC_ADDR: ":50051"
      DATABASE_URL: postgres://concert:concert@concert-db:5432/concert?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      concert-db:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - miniticket

  concert-db:
    image: postgres:17-alpine
    container_name: miniticket-concert-db
    environment:
      POSTGRES_DB: concert
      POSTGRES_USER: concert
      POSTGRES_PASSWORD: concert
    volumes:
      - concert-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concert -d concert"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - miniticket

  reservation-service:
    build:
      context: ..
      dockerfile: deploy/docker/reservation.Dockerfile
    container_name: miniticket-reservation-service
    environment:
      APP_ENV: local
      GRPC_ADDR: ":50051"
      DATABASE_URL: postgres://reservation:reservation@reservation-db:5432/reservation?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      reservation-db:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - miniticket

  reservation-db:
    image: postgres:17-alpine
    container_name: miniticket-reservation-db
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    volumes:
      - reservation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - miniticket

  payment-service:
    build:
      context: ..
      dockerfile: deploy/docker/payment.Dockerfile
    container_name: miniticket-payment-service
    environment:
      APP_ENV: local
      GRPC_ADDR: ":50051"
      DATABASE_URL: postgres://payment:payment@payment-db:5432/payment?sslmode=disable
      NATS_URL: nats://nats:4222
      # PAYMENT_PROVIDER_URL: http://mock-payment-provider:8080
    depends_on:
      payment-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      # mock-payment-provider:
      #   condition: service_started
    networks:
      - miniticket

  payment-db:
    image: postgres:17-alpine
    container_name: miniticket-payment-db
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - miniticket

  saga-orchestrator:
    build:
      context: ..
      dockerfile: deploy/docker/saga-orchestrator.Dockerfile
    container_name: miniticket-saga-orchestrator
    environment:
      APP_ENV: local
      GRPC_ADDR: ":50051"
      DATABASE_URL: postgres://saga:saga@saga-db:5432/saga?sslmode=disable
      NATS_URL: nats://nats:4222

      CONCERT_SERVICE_ADDR: concert-service:50051
      RESERVATION_SERVICE_ADDR: reservation-service:50051
      PAYMENT_SERVICE_ADDR: payment-service:50051
    depends_on:
      saga-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      concert-service:
        condition: service_started
      reservation-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - miniticket

  saga-db:
    image: postgres:17-alpine
    container_name: miniticket-saga-db
    environment:
      POSTGRES_DB: saga
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
    volumes:
      - saga-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d saga"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - miniticket

  notification-service:
    build:
      context: ..
      dockerfile: deploy/docker/notification.Dockerfile
    container_name: miniticket-notification-service
    environment:
      APP_ENV: local
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - miniticket

  # mock-payment-provider:
  #   build:
  #     context: ..
  #     dockerfile: deploy/docker/mock-payment-provider.Dockerfile
  #   container_name: miniticket-mock-payment-provider
  #   environment:
  #     APP_ENV: local
  #     HTTP_ADDR: ":8080"
  #   networks:
  #     - miniticket

  nats:
    image: nats:2.11-alpine
    container_name: miniticket-nats
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8222/healthz
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - miniticket

volumes:
  auth-db-data:
  concert-db-data:
  reservation-db-data:
  payment-db-data:
  saga-db-data:
  nats-data:

networks:
  miniticket:
    driver: bridge
